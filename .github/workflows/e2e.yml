name: E2E

# 正本: docs/plan/Template/20260807_template-design.md §5「タスクとゲート」末尾、§9「最小の縦切り」末尾。
# E2E は `mise run check` に含めない(原則8の「1コマンド」は check の話であり、
# E2E はその外)。main マージ時のみ実行する。

on:
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: mise run test:e2e
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: mise install
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: pnpm install(frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Playwright ブラウザバイナリのインストール
        run: pnpm --filter ./e2e exec playwright install --with-deps chromium

      - name: mise run test:e2e
        run: mise run test:e2e

      - name: mise run test:e2e:unused-steps
        run: mise run test:e2e:unused-steps

      - name: playwright-report をアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
